<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17251e"><title>Kaja & Mozgás napló</title>
<style>
:root{color-scheme:light;--ink:#18251f;--muted:#68766e;--line:#dce5de;--paper:#f5f7f2;--green:#244b38;--lime:#d7ef9a;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--green);color:white;padding:28px 18px 30px;border-radius:0 0 24px 24px}header .inner,main{max-width:900px;margin:auto}header p{margin:6px 0 0;color:#dce9df}h1{font-size:27px;margin:0;letter-spacing:-.6px}main{padding:18px 14px 48px}.entry{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 3px 12px #15291b08}.entry h2{font-size:20px;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}.movement .fields{grid-template-columns:1fr 1fr 1.3fr}.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}input,select,textarea{font:inherit;width:100%;min-width:0;border:1px solid #cbd7cd;border-radius:10px;padding:11px 10px;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:44px}input[type=file]{font-size:13px;padding:9px}button,.download{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.save{background:var(--green);color:#fff;margin-top:13px;width:100%}.secondary{background:#e9efe8;color:var(--green)}.danger{background:#fff0ed;color:#9b3325}.entry-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.entry-actions button{font-size:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 2px 12px}.section-head h2{margin:0;font-size:21px}.count{font-size:13px;color:var(--muted)}.saved{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px}.saved-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.saved h3{margin:0 0 4px;font-size:17px}.stamp{font-size:12px;color:var(--muted)}.saved p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.saved img{display:block;max-width:100%;max-height:250px;object-fit:contain;border-radius:10px;margin-top:10px;background:#f1f3ef}.saved.editing{border-color:#72967a}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #cbd7cd;border-radius:14px}.hint{font-size:12px;color:var(--muted);margin:10px 2px}.tabs{display:flex;gap:8px;margin:0 0 16px}.calendar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.calendar-head h3{margin:0;font-size:19px;text-transform:capitalize}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-weekday{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:5px 0}.calendar-day{min-height:47px;padding:6px 2px;border-radius:9px;background:#f5f7f2;color:var(--ink);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px}.calendar-day.outside{opacity:.35}.calendar-day.selected{border-color:var(--green);background:#e3eedf}.calendar-day.today{box-shadow:inset 0 0 0 1px #86a77b}.day-dots{display:flex;gap:3px;min-height:6px}.day-dot{width:5px;height:5px;border-radius:50%;background:var(--green)}.day-dot.move{background:#d29a38}.day-detail{margin-top:16px}.day-detail h3{margin:0 0 10px;font-size:18px}.day-section{margin:12px 0}.day-section h4{margin:0 0 7px;font-size:15px}.day-entry{border:1px solid var(--line);border-radius:11px;padding:11px;margin:7px 0;background:#fbfcfa}.day-entry p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.day-entry img{display:block;max-width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin-top:8px}.day-nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.day-nav button{flex:1;min-height:48px}.download-tools{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}.tab{flex:1;background:#e9efe8;color:var(--green)}.tab.active{background:var(--green);color:#fff}.hidden{display:none!important}@media(max-width:600px){.fields,.movement .fields{grid-template-columns:1fr}.entry{padding:15px}.saved-top{align-items:flex-start}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="inner"><h1>Kaja & Mozgás</h1><p>Egyszerű napi étkezés- és mozgásnapló</p></div></header>
<main>
<nav class="tabs" aria-label="Napló fülek"><button class="tab active" id="entryTab">Új bejegyzés</button><button class="tab" id="savedTab">Mentett bejegyzések</button></nav>
<div id="entryPanel">
<section class="entry movement" id="moveEntry"><h2>🏃 Mozgás</h2><div class="fields">
<div class="field"><label for="moveType">Mozgás típusa</label><select id="moveType"><option>séta</option><option>futás</option><option>úszás</option><option>kondi</option><option>egyéb</option></select></div>
<div class="field"><label for="durationHours">Időtartam</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><select id="durationHours" aria-label="Óra"><option value="0">0 óra</option><option value="1">1 óra</option><option value="2">2 óra</option><option value="3">3 óra</option><option value="4">4 óra</option><option value="5">5 óra</option><option value="6">6 óra</option></select><select id="durationMinutes" aria-label="Perc"><option value="0">0 perc</option><option value="5">5 perc</option><option value="10">10 perc</option><option value="15">15 perc</option><option value="20">20 perc</option><option value="25">25 perc</option><option value="30">30 perc</option><option value="35">35 perc</option><option value="40">40 perc</option><option value="45">45 perc</option><option value="50">50 perc</option><option value="55">55 perc</option></select></div></div>
<div class="field"><label for="moveText">Megjegyzés</label><textarea id="moveText" placeholder="Szabad szöveg…"></textarea></div>
</div><button class="save" id="saveMove">Mozgás mentése</button></section>

<section class="entry" id="foodEntry"><h2>🥗 Kaja</h2><div class="fields">
<div class="field"><label for="foodType">Étkezés</label><select id="foodType"><option>reggeli</option><option>ebéd</option><option>vacsora</option><option>nasi</option></select></div>
<div class="field"><label for="foodText">Mit ettél/ittál?</label><textarea id="foodText" placeholder="Szabad szöveg…"></textarea></div>
<div class="field" style="grid-column:1/-1"><label for="foodPhoto">Kép feltöltése (nem kötelező)</label><input id="foodPhoto" type="file" accept="image/*" capture="environment"><div id="photoName" class="hint"></div></div>
</div><button class="save" id="saveFood">Kaja mentése</button></section></div>
<div id="savedPanel" class="hidden">
<div class="section-head"><h2>Mentett bejegyzések</h2><span class="count" id="count">0 bejegyzés</span></div>
<p class="hint">Válassz egy napot a naptárban a napi kaják és mozgások megtekintéséhez.</p>
<section class="calendar">
<div class="calendar-head"><button class="secondary" id="prevMonth" aria-label="Előző hónap">‹</button><h3 id="calendarMonth"></h3><button class="secondary" id="nextMonth" aria-label="Következő hónap">›</button></div>
<div class="calendar-grid" id="calendarGrid"></div>
<div class="day-detail" id="dayDetail"></div>
</section>
<div id="savedList" class="hidden"></div>
<div class="download-tools"><div class="section-head" style="margin-top:0"><h2>Letöltés</h2></div><div class="toolbar"><button class="secondary" id="exportFood">Kaja letöltése (CSV)</button><button class="secondary" id="exportMove">Mozgás letöltése (CSV)</button><button class="secondary" id="exportJson">Teljes napló (JSON)</button><button class="secondary" id="exportZip">Teljes napló + képek (ZIP)</button><button class="secondary" id="exportCsv">Teljes napló (CSV)</button><button class="danger" id="clearAll">Összes törlése</button></div><p class="hint">A ZIP-export a képeket külön, dátum/idő alapján elnevezett mappákba rendezi.</p></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const DB_NAME='kaja-mozgas-db', STORE='entries'; let db, calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), selectedDay=localDateKey(new Date());
const $=id=>document.getElementById(id);
const stamp=()=>new Date().toISOString();
const fmt=iso=>new Intl.DateTimeFormat('hu-HU',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso));
const toLocalInput=iso=>{const d=new Date(iso);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
const fromLocalInput=value=>new Date(value).toISOString();
const safe=s=>String(s||'').replace(/[<>]/g,'');
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function all(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>b.savedAt.localeCompare(a.savedAt)));r.onerror=()=>reject(r.error)})}
function put(item){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(item);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function remove(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function fileStamp(iso){return iso.replace(/[-:]/g,'').replace('T','_').replace(/\.\d+Z$/,'Z')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('foodPhoto').addEventListener('change',()=>{$('photoName').textContent=$('foodPhoto').files[0]?.name||''});
$('saveFood').onclick=async()=>{const file=$('foodPhoto').files[0];let photo=null;if(file){if(file.size>12*1024*1024){alert('A kép legfeljebb 12 MB lehet.');return}photo={blob:file,name:file.name,type:file.type||'image/jpeg'}}
const now=stamp();await put({id:crypto.randomUUID(),kind:'food',type:$('foodType').value,text:$('foodText').value.trim(),photo,savedAt:now,createdAt:now});$('foodText').value='';$('foodPhoto').value='';$('photoName').textContent='';await render()};
$('saveMove').onclick=async()=>{const now=stamp();await put({id:crypto.randomUUID(),kind:'move',type:$('moveType').value,hours:+$('durationHours').value,minutes:+$('durationMinutes').value,text:$('moveText').value.trim(),savedAt:now,createdAt:now});$('moveText').value='';$('durationHours').value='0';$('durationMinutes').value='0';await render()};
function localDateKey(date){const d=date instanceof Date?date:new Date(date);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateForItem(item){return localDateKey(item.savedAt||item.createdAt||stamp())}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function render(){const items=await all();renderCalendar(items)}
function renderCalendar(items){const grid=$('calendarGrid');grid.innerHTML='';$('calendarMonth').textContent=new Intl.DateTimeFormat('hu-HU',{month:'long',year:'numeric'}).format(calendarMonth);const weekdays=['H','K','Sze','Cs','P','Szo','V'];for(const day of weekdays){const el=document.createElement('div');el.className='calendar-weekday';el.textContent=day;grid.appendChild(el)}
const first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1);const offset=(first.getDay()+6)%7;const startDate=new Date(first);startDate.setDate(first.getDate()-offset);const today=localDateKey(new Date());
for(let i=0;i<42;i++){const date=new Date(startDate);date.setDate(startDate.getDate()+i);const key=localDateKey(date);const dayItems=items.filter(item=>dateForItem(item)===key);const food=dayItems.some(item=>item.kind==='food'),move=dayItems.some(item=>item.kind==='move');const btn=document.createElement('button');btn.className='calendar-day'+(date.getMonth()!==calendarMonth.getMonth()?' outside':'')+(key===selectedDay?' selected':'')+(key===today?' today':'');btn.innerHTML='<span>'+date.getDate()+'</span><span class="day-dots">'+(food?'<i class="day-dot"></i>':'')+(move?'<i class="day-dot move"></i>':'')+'</span>';btn.setAttribute('aria-label',key+(food?' kaja':'')+(move?' mozgás':''));btn.onclick=()=>{selectedDay=key;if(date.getMonth()!==calendarMonth.getMonth())calendarMonth=new Date(date.getFullYear(),date.getMonth(),1);renderCalendar(items)};grid.appendChild(btn)}
const detail=$('dayDetail');const dateItems=items.filter(item=>dateForItem(item)===selectedDay).sort((a,b)=>(a.savedAt||'').localeCompare(b.savedAt||''));const [year,month,day]=selectedDay.split('-').map(Number);const dateLabel=new Intl.DateTimeFormat('hu-HU',{dateStyle:'full'}).format(new Date(year,month-1,day));detail.innerHTML='<h3>'+escapeHtml(dateLabel)+'</h3>';const foods=dateItems.filter(item=>item.kind==='food'),moves=dateItems.filter(item=>item.kind==='move');
function section(title,entries,kind){const section=document.createElement('div');section.className='day-section';const heading=document.createElement('h4');heading.textContent=title+' ('+entries.length+')';section.appendChild(heading);if(!entries.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=kind==='food'?'Ezen a napon nincs kajabejegyzés.':'Ezen a napon nincs mozgásbejegyzés.';section.appendChild(empty);return section}
for(const item of entries){const card=document.createElement('article');card.className='day-entry';const time=new Intl.DateTimeFormat('hu-HU',{hour:'2-digit',minute:'2-digit'}).format(new Date(item.savedAt||item.createdAt||stamp()));card.innerHTML='<div class="saved-top"><div><strong>'+escapeHtml(item.type)+'</strong><div class="stamp">'+time+(kind==='move'?' · '+(item.hours||0)+' óra '+(item.minutes||0)+' perc':'')+'</div></div></div><p>'+escapeHtml(item.text||'Nincs megjegyzés.')+'</p><div class="entry-actions"><button class="secondary edit-day">Szerkesztés</button><button class="danger delete-day">Törlés</button></div>';
if(item.photo?.blob){const img=document.createElement('img');img.alt='Feltöltött ételfotó';img.src=URL.createObjectURL(item.photo.blob);card.appendChild(img)}
card.querySelector('.delete-day').onclick=async()=>{if(confirm('Törlöd ezt a bejegyzést?')){await remove(item.id);render()}};card.querySelector('.edit-day').onclick=()=>{const list=$('savedList');list.classList.remove('hidden');list.innerHTML='';const editCardEl=document.createElement('article');editCardEl.className='saved';editCardEl.innerHTML='<div class="view"><h3>'+escapeHtml(kind==='food'?'🥗 Kaja · '+item.type:'🏃 Mozgás · '+item.type)+'</h3></div><div class="editform hidden"></div><div class="entry-actions"><button class="secondary edit">Szerkesztés</button></div>';list.appendChild(editCardEl);editCard(editCardEl,item);editCardEl.scrollIntoView({behavior:'smooth',block:'start'})};section.appendChild(card)}return section}
detail.appendChild(section('🥗 Kaja',foods,'food'));detail.appendChild(section('🏃 Mozgás',moves,'move'));const nav=document.createElement('div');nav.className='day-nav';nav.innerHTML='<button type="button" class="secondary" id="prevDay">← Előző nap</button><button type="button" class="secondary" id="nextDay">Következő nap →</button>';detail.appendChild(nav);$('prevDay').onclick=()=>changeSelectedDay(-1,items);$('nextDay').onclick=()=>changeSelectedDay(1,items)}
function changeSelectedDay(offset,items){const [y,m,d]=selectedDay.split('-').map(Number);const next=new Date(y,m-1,d+offset);selectedDay=localDateKey(next);if(next.getMonth()!==calendarMonth.getMonth()||next.getFullYear()!==calendarMonth.getFullYear())calendarMonth=new Date(next.getFullYear(),next.getMonth(),1);renderCalendar(items)}
$('prevMonth').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render()};$('nextMonth').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render()};
function editCard(card,item){const f=card.querySelector('.editform'),v=card.querySelector('.view'),btn=card.querySelector('.edit');if(!f.classList.contains('hidden'))return;v.classList.add('hidden');f.classList.remove('hidden');btn.textContent='Mégse';btn.onclick=()=>{f.classList.add('hidden');v.classList.remove('hidden');btn.textContent='Szerkesztés';btn.onclick=()=>editCard(card,item)};
const isFood=item.kind==='food';f.innerHTML=(isFood?'<label>Étkezés</label><select id="eType"><option>reggeli</option><option>ebéd</option><option>vacsora</option><option>nasi</option></select>':'<label>Mozgás</label><select id="eType"><option>séta</option><option>futás</option><option>úszás</option><option>kondi</option><option>egyéb</option></select>')+'<label style="display:block;margin-top:10px">Dátum és idő</label><input id="eDate" type="datetime-local" required><label style="display:block;margin-top:10px">Szabad szöveg</label><textarea id="eText"></textarea>'+(isFood?'<label style="display:block;margin-top:10px">Kép cseréje (opcionális)</label><input id="ePhoto" type="file" accept="image/*">':'<div class="fields" style="margin-top:10px"><div><label>Óra</label><select id="eHours">'+[0,1,2,3,4,5,6].map(n=>'<option value="'+n+'">'+n+' óra</option>').join('')+'</select></div><div><label>Perc</label><select id="eMinutes">'+[0,5,10,15,20,25,30,35,40,45,50,55].map(n=>'<option value="'+n+'">'+n+' perc</option>').join('')+'</select></div></div>')+'<button class="save" style="margin-bottom:8px" id="applyEdit">Módosítás mentése</button>';
f.querySelector('#eType').value=item.type;f.querySelector('#eDate').value=toLocalInput(item.savedAt||item.createdAt||stamp());f.querySelector('#eText').value=item.text||'';if(!isFood){f.querySelector('#eHours').value=item.hours;f.querySelector('#eMinutes').value=item.minutes}
f.querySelector('#applyEdit').onclick=async()=>{const dateValue=f.querySelector('#eDate').value;if(!dateValue){alert('Adj meg dátumot és időpontot.');return}const updated={...item,type:f.querySelector('#eType').value,text:f.querySelector('#eText').value.trim(),savedAt:fromLocalInput(dateValue)};if(!isFood){updated.hours=+f.querySelector('#eHours').value;updated.minutes=+f.querySelector('#eMinutes').value}else{const file=f.querySelector('#ePhoto').files[0];if(file){if(file.size>12*1024*1024){alert('A kép legfeljebb 12 MB lehet.');return}updated.photo={blob:file,name:file.name,type:file.type||'image/jpeg'}}}await put(updated);selectedDay=localDateKey(updated.savedAt);const [selectedYear,selectedMonth]=selectedDay.split('-').map(Number);calendarMonth=new Date(selectedYear,selectedMonth-1,1);render()}}
$('entryTab').onclick=()=>{$('entryPanel').classList.remove('hidden');$('savedPanel').classList.add('hidden');$('entryTab').classList.add('active');$('savedTab').classList.remove('active')};
$('savedTab').onclick=()=>{$('entryPanel').classList.add('hidden');$('savedPanel').classList.remove('hidden');$('entryTab').classList.remove('active');$('savedTab').classList.add('active');render()};

function jsonItems(items){return items.map(({photo,...rest})=>({...rest,photo:photo?{name:photo.name,type:photo.type}:null}))}
$('exportJson').onclick=async()=>download(new Blob([JSON.stringify({exportedAt:stamp(),entries:jsonItems(await all())},null,2)],{type:'application/json'}),'kaja-mozgas-naplo.json');
function csvQuote(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
async function exportKind(kind){const items=(await all()).filter(i=>i.kind===kind);const rows=[['Típus','Kategória','Szöveg','Óra','Perc','Mentés időpontja','Kép fájl'].join(';'),...items.map(i=>[i.kind==='food'?'kaja':'mozgás',i.type,i.text||'',i.hours??'',i.minutes??'',fmt(i.savedAt),i.photo?fileStamp(i.savedAt)+'_'+(i.photo.name||'kep'):''].map(csvQuote).join(';'))];download(new Blob(['\\ufeff'+rows.join('\\r\\n')],{type:'text/csv;charset=utf-8'}),kind==='food'?'kaja-bejegyzesek.csv':'mozgas-bejegyzesek.csv')}
$('exportFood').onclick=()=>exportKind('food');$('exportMove').onclick=()=>exportKind('move');
$('exportCsv').onclick=async()=>{const items=await all(),q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',rows=[['Típus','Kategória','Szöveg','Óra','Perc','Mentés időpontja','Kép fájl'].join(';'),...items.map(i=>[i.kind==='food'?'kaja':'mozgás',i.type,i.text||'',i.hours??'',i.minutes??'',fmt(i.savedAt),i.photo?fileStamp(i.savedAt)+'_'+(i.photo.name||'kep'):''].map(q).join(';'))];download(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),'kaja-mozgas-naplo.csv')};
$('exportZip').onclick=async()=>{const items=await all();if(!window.JSZip){alert('A ZIP-készítő könyvtár nem érhető el. Ellenőrizd az internetkapcsolatot.');return}const zip=new JSZip();zip.file('naplo.json',JSON.stringify({exportedAt:stamp(),entries:jsonItems(items)},null,2));zip.file('naplo.csv',items.map(i=>[i.kind,i.type,(i.text||'').replace(/;/g,','),i.hours??'',i.minutes??'',i.savedAt].join(';')).join('\n'));for(const i of items){if(i.photo?.blob){const folder='kepek/'+fileStamp(i.savedAt)+'/';zip.folder(folder);zip.file(folder+(i.photo.name||'kep.jpg'),i.photo.blob)}}const blob=await zip.generateAsync({type:'blob'});download(blob,'kaja-mozgas-teljes-naplo.zip')};
$('clearAll').onclick=async()=>{if(!confirm('Biztosan törlöd az összes bejegyzést és képet? Ezt nem lehet visszavonni.'))return;const items=await all();const tx=db.transaction(STORE,'readwrite');items.forEach(i=>tx.objectStore(STORE).delete(i.id));tx.oncomplete=render};
openDB().then(render).catch(e=>{console.error(e);alert('Nem sikerült elindítani a helyi adatbázist. Nyisd meg HTTPS-en keresztül.')});
</script>
</body></html>
