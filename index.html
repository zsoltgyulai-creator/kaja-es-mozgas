<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17251e"><title>Kaja & Mozgás napló</title>
<style>
:root{color-scheme:light;--ink:#18251f;--muted:#68766e;--line:#dce5de;--paper:#f5f7f2;--green:#244b38;--lime:#d7ef9a;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--green);color:white;padding:28px 18px 30px;border-radius:0 0 24px 24px}header .inner,main{max-width:900px;margin:auto}header p{margin:6px 0 0;color:#dce9df}h1{font-size:27px;margin:0;letter-spacing:-.6px}main{padding:18px 14px 48px}.entry{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 3px 12px #15291b08}.entry h2{font-size:20px;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}.movement .fields{grid-template-columns:1fr 1fr 1.3fr}.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}input,select,textarea{font:inherit;width:100%;min-width:0;border:1px solid #cbd7cd;border-radius:10px;padding:11px 10px;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:44px}input[type=file]{font-size:13px;padding:9px}button,.download{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.save{background:var(--green);color:#fff;margin-top:13px;width:100%}.secondary{background:#e9efe8;color:var(--green)}.danger{background:#fff0ed;color:#9b3325}.entry-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.entry-actions button{font-size:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 2px 12px}.section-head h2{margin:0;font-size:21px}.count{font-size:13px;color:var(--muted)}.saved{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px}.saved-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.saved h3{margin:0 0 4px;font-size:17px}.stamp{font-size:12px;color:var(--muted)}.saved p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.saved img{display:block;max-width:100%;max-height:250px;object-fit:contain;border-radius:10px;margin-top:10px;background:#f1f3ef}.saved.editing{border-color:#72967a}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #cbd7cd;border-radius:14px}.hint{font-size:12px;color:var(--muted);margin:10px 2px}.tabs{display:flex;gap:8px;margin:0 0 16px}.tab{flex:1;background:#e9efe8;color:var(--green)}.tab.active{background:var(--green);color:#fff}.hidden{display:none!important}@media(max-width:600px){.fields,.movement .fields{grid-template-columns:1fr}.entry{padding:15px}.saved-top{align-items:flex-start}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="inner"><h1>Kaja & Mozgás</h1><p>Egyszerű napi étkezés- és mozgásnapló</p></div></header>
<main>
<nav class="tabs" aria-label="Napló fülek"><button class="tab active" id="entryTab">Új bejegyzés</button><button class="tab" id="savedTab">Mentett bejegyzések</button></nav>
<div id="entryPanel">
<section class="entry" id="foodEntry"><h2>🥗 Kaja</h2><div class="fields">
<div class="field"><label for="foodType">Étkezés</label><select id="foodType"><option>reggeli</option><option>ebéd</option><option>vacsora</option><option>nasi</option></select></div>
<div class="field"><label for="foodText">Mit ettél/ittál?</label><textarea id="foodText" placeholder="Szabad szöveg…"></textarea></div>
<div class="field" style="grid-column:1/-1"><label for="foodPhoto">Kép feltöltése (nem kötelező)</label><input id="foodPhoto" type="file" accept="image/*" capture="environment"><div id="photoName" class="hint"></div></div>
</div><button class="save" id="saveFood">Kaja mentése</button></section>
<section class="entry movement" id="moveEntry"><h2>🏃 Mozgás</h2><div class="fields">
<div class="field"><label for="moveType">Mozgás típusa</label><select id="moveType"><option>séta</option><option>futás</option><option>úszás</option><option>kondi</option></select></div>
<div class="field"><label for="durationHours">Időtartam</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><select id="durationHours" aria-label="Óra"><option value="0">0 óra</option><option value="1">1 óra</option><option value="2">2 óra</option><option value="3">3 óra</option><option value="4">4 óra</option><option value="5">5 óra</option><option value="6">6 óra</option></select><select id="durationMinutes" aria-label="Perc"><option value="0">0 perc</option><option value="5">5 perc</option><option value="10">10 perc</option><option value="15">15 perc</option><option value="20">20 perc</option><option value="25">25 perc</option><option value="30">30 perc</option><option value="35">35 perc</option><option value="40">40 perc</option><option value="45">45 perc</option><option value="50">50 perc</option><option value="55">55 perc</option></select></div></div>
<div class="field"><label for="moveText">Megjegyzés</label><textarea id="moveText" placeholder="Szabad szöveg…"></textarea></div>
</div><button class="save" id="saveMove">Mozgás mentése</button></section>
</div>
<div id="savedPanel" class="hidden">
<div class="section-head"><h2>Mentett bejegyzések</h2><span class="count" id="count">0 bejegyzés</span></div>
<div class="toolbar"><button class="secondary" id="showFood">🥗 Kaja megjelenítése</button><button class="secondary" id="showMove">🏃 Mozgás megjelenítése</button></div>
<div class="toolbar" style="margin-top:8px"><button class="secondary" id="exportFood">Kaja letöltése (CSV)</button><button class="secondary" id="exportMove">Mozgás letöltése (CSV)</button><button class="secondary" id="exportJson">Teljes napló (JSON)</button><button class="secondary" id="exportZip">Teljes napló + képek (ZIP)</button><button class="secondary" id="exportCsv">Teljes napló (CSV)</button><button class="danger" id="clearAll">Összes törlése</button></div>
<p class="hint">A bejegyzések ezen az eszközön, a böngészőben tárolódnak. A ZIP-export a képeket külön, dátum/idő alapján elnevezett mappákba rendezi.</p>
<div id="savedList"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const DB_NAME='kaja-mozgas-db', STORE='entries'; let db, savedFilter='food';
const $=id=>document.getElementById(id);
const stamp=()=>new Date().toISOString();
const fmt=iso=>new Intl.DateTimeFormat('hu-HU',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso));
const safe=s=>String(s||'').replace(/[<>]/g,'');
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function all(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>b.savedAt.localeCompare(a.savedAt)));r.onerror=()=>reject(r.error)})}
function put(item){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(item);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function remove(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function fileStamp(iso){return iso.replace(/[-:]/g,'').replace('T','_').replace(/\.\d+Z$/,'Z')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('foodPhoto').addEventListener('change',()=>{$('photoName').textContent=$('foodPhoto').files[0]?.name||''});
$('saveFood').onclick=async()=>{const file=$('foodPhoto').files[0];let photo=null;if(file){if(file.size>12*1024*1024){alert('A kép legfeljebb 12 MB lehet.');return}photo={blob:file,name:file.name,type:file.type||'image/jpeg'}}
const now=stamp();await put({id:crypto.randomUUID(),kind:'food',type:$('foodType').value,text:$('foodText').value.trim(),photo,savedAt:now,createdAt:now});$('foodText').value='';$('foodPhoto').value='';$('photoName').textContent='';await render()};
$('saveMove').onclick=async()=>{const now=stamp();await put({id:crypto.randomUUID(),kind:'move',type:$('moveType').value,hours:+$('durationHours').value,minutes:+$('durationMinutes').value,text:$('moveText').value.trim(),savedAt:now,createdAt:now});$('moveText').value='';$('durationHours').value='0';$('durationMinutes').value='0';await render()};
async function render(){const items=await all();const visible=items.filter(i=>i.kind===savedFilter);$('count').textContent=visible.length+' bejegyzés';const list=$('savedList');list.innerHTML='';if(!visible.length){list.innerHTML='<div class="empty">'+(savedFilter==='food'?'Még nincs mentett kaja bejegyzés.':'Még nincs mentett mozgás bejegyzés.')+'</div>';return}
for(const item of visible){const card=document.createElement('article');card.className='saved';card.dataset.id=item.id;const isFood=item.kind==='food';const title=isFood?'🥗 Kaja · '+item.type:'🏃 Mozgás · '+item.type;const duration=!isFood?'<p><b>Időtartam:</b> '+item.hours+' óra '+item.minutes+' perc</p>':'';card.innerHTML='<div class="saved-top"><div><h3>'+safe(title)+'</h3><div class="stamp">Mentve: '+fmt(item.savedAt)+'</div></div></div><div class="view"><p>'+safe(item.text||'Nincs megjegyzés.')+'</p>'+duration+'</div><div class="editform hidden"></div><div class="entry-actions"><button class="secondary edit">Szerkesztés</button><button class="danger delete">Törlés</button></div>';
if(item.photo?.blob){const img=document.createElement('img');img.alt='Feltöltött ételfotó';img.src=URL.createObjectURL(item.photo.blob);card.querySelector('.view').appendChild(img)}
card.querySelector('.delete').onclick=async()=>{if(confirm('Törlöd ezt a bejegyzést?')){await remove(item.id);render()}};
card.querySelector('.edit').onclick=()=>editCard(card,item);
list.appendChild(card)}}
function editCard(card,item){const f=card.querySelector('.editform'),v=card.querySelector('.view'),btn=card.querySelector('.edit');if(!f.classList.contains('hidden'))return;v.classList.add('hidden');f.classList.remove('hidden');btn.textContent='Mégse';btn.onclick=()=>{f.classList.add('hidden');v.classList.remove('hidden');btn.textContent='Szerkesztés';btn.onclick=()=>editCard(card,item)};
const isFood=item.kind==='food';f.innerHTML=(isFood?'<label>Étkezés</label><select id="eType"><option>reggeli</option><option>ebéd</option><option>vacsora</option><option>nasi</option></select>':'<label>Mozgás</label><select id="eType"><option>séta</option><option>futás</option><option>úszás</option><option>kondi</option></select>')+'<label style="display:block;margin-top:10px">Szabad szöveg</label><textarea id="eText"></textarea>'+(isFood?'<label style="display:block;margin-top:10px">Kép cseréje (opcionális)</label><input id="ePhoto" type="file" accept="image/*">':'<div class="fields" style="margin-top:10px"><div><label>Óra</label><select id="eHours">'+[0,1,2,3,4,5,6].map(n=>'<option value="'+n+'">'+n+' óra</option>').join('')+'</select></div><div><label>Perc</label><select id="eMinutes">'+[0,5,10,15,20,25,30,35,40,45,50,55].map(n=>'<option value="'+n+'">'+n+' perc</option>').join('')+'</select></div></div>')+'<button class="save" style="margin-bottom:8px" id="applyEdit">Módosítás mentése</button>';
f.querySelector('#eType').value=item.type;f.querySelector('#eText').value=item.text||'';if(!isFood){f.querySelector('#eHours').value=item.hours;f.querySelector('#eMinutes').value=item.minutes}
f.querySelector('#applyEdit').onclick=async()=>{const updated={...item,type:f.querySelector('#eType').value,text:f.querySelector('#eText').value.trim(),savedAt:stamp()};if(!isFood){updated.hours=+f.querySelector('#eHours').value;updated.minutes=+f.querySelector('#eMinutes').value}else{const file=f.querySelector('#ePhoto').files[0];if(file){if(file.size>12*1024*1024){alert('A kép legfeljebb 12 MB lehet.');return}updated.photo={blob:file,name:file.name,type:file.type||'image/jpeg'}}}await put(updated);render()}}
$('entryTab').onclick=()=>{$('entryPanel').classList.remove('hidden');$('savedPanel').classList.add('hidden');$('entryTab').classList.add('active');$('savedTab').classList.remove('active')};
$('savedTab').onclick=()=>{$('entryPanel').classList.add('hidden');$('savedPanel').classList.remove('hidden');$('entryTab').classList.remove('active');$('savedTab').classList.add('active');render()};
$('showFood').onclick=()=>{savedFilter='food';$('showFood').classList.add('active');$('showMove').classList.remove('active');render()};
$('showMove').onclick=()=>{savedFilter='move';$('showMove').classList.add('active');$('showFood').classList.remove('active');render()};
function jsonItems(items){return items.map(({photo,...rest})=>({...rest,photo:photo?{name:photo.name,type:photo.type}:null}))}
$('exportJson').onclick=async()=>download(new Blob([JSON.stringify({exportedAt:stamp(),entries:jsonItems(await all())},null,2)],{type:'application/json'}),'kaja-mozgas-naplo.json');
function csvQuote(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
async function exportKind(kind){const items=(await all()).filter(i=>i.kind===kind);const rows=[['Típus','Kategória','Szöveg','Óra','Perc','Mentés időpontja','Kép fájl'].join(';'),...items.map(i=>[i.kind==='food'?'kaja':'mozgás',i.type,i.text||'',i.hours??'',i.minutes??'',fmt(i.savedAt),i.photo?fileStamp(i.savedAt)+'_'+(i.photo.name||'kep'):''].map(csvQuote).join(';'))];download(new Blob(['\\ufeff'+rows.join('\\r\\n')],{type:'text/csv;charset=utf-8'}),kind==='food'?'kaja-bejegyzesek.csv':'mozgas-bejegyzesek.csv')}
$('exportFood').onclick=()=>exportKind('food');$('exportMove').onclick=()=>exportKind('move');
$('exportCsv').onclick=async()=>{const items=await all(),q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',rows=[['Típus','Kategória','Szöveg','Óra','Perc','Mentés időpontja','Kép fájl'].join(';'),...items.map(i=>[i.kind==='food'?'kaja':'mozgás',i.type,i.text||'',i.hours??'',i.minutes??'',fmt(i.savedAt),i.photo?fileStamp(i.savedAt)+'_'+(i.photo.name||'kep'):''].map(q).join(';'))];download(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),'kaja-mozgas-naplo.csv')};
$('exportZip').onclick=async()=>{const items=await all();if(!window.JSZip){alert('A ZIP-készítő könyvtár nem érhető el. Ellenőrizd az internetkapcsolatot.');return}const zip=new JSZip();zip.file('naplo.json',JSON.stringify({exportedAt:stamp(),entries:jsonItems(items)},null,2));zip.file('naplo.csv',items.map(i=>[i.kind,i.type,(i.text||'').replace(/;/g,','),i.hours??'',i.minutes??'',i.savedAt].join(';')).join('\n'));for(const i of items){if(i.photo?.blob){const folder='kepek/'+fileStamp(i.savedAt)+'/';zip.folder(folder);zip.file(folder+(i.photo.name||'kep.jpg'),i.photo.blob)}}const blob=await zip.generateAsync({type:'blob'});download(blob,'kaja-mozgas-teljes-naplo.zip')};
$('clearAll').onclick=async()=>{if(!confirm('Biztosan törlöd az összes bejegyzést és képet? Ezt nem lehet visszavonni.'))return;const items=await all();const tx=db.transaction(STORE,'readwrite');items.forEach(i=>tx.objectStore(STORE).delete(i.id));tx.oncomplete=render};
openDB().then(render).catch(e=>{console.error(e);alert('Nem sikerült elindítani a helyi adatbázist. Nyisd meg HTTPS-en keresztül.')});
</script>
</body></html>
